<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>もじさん＆ゲイリーのゲート突破大作戦</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b132b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
    }

    #game-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* UI オーバーレイコンテナ */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .interactive {
      pointer-events: auto;
    }

    /* HUD スタイル */
    #hud {
      width: 100%;
      padding: env(safe-area-inset-top, 16px) 16px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* ゲイリー数バブル（ぷるぷるスライムデザイン） */
    .gary-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #64ff24, #00e676);
      color: #003800;
      padding: 6px 16px;
      border-radius: 26px;
      font-weight: 900;
      font-size: 1.15rem;
      box-shadow: 0 4px 18px rgba(100, 255, 36, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      border: 2px solid #ffffff;
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .pop-bounce {
      animation: bouncePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes bouncePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-4deg); }
      70% { transform: scale(0.95) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .gary-face-svg {
      width: 28px;
      height: 28px;
      display: inline-block;
      vertical-align: middle;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.2));
    }

    .gary-label {
      font-size: 0.85rem;
      font-weight: 800;
      opacity: 0.9;
    }

    /* スコア */
    .score-badge {
      background: rgba(11, 19, 43, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 229, 255, 0.4);
      color: #00e5ff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* サウンドボタン */
    #mute-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: none;
      font-size: 1.2rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
    }

    /* プログレスバー */
    .progress-bar-container {
      width: 100%;
      max-width: 280px;
      margin: 0 auto;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00e5ff, #76ff03);
      border-radius: 8px;
      transition: width 0.1s linear;
    }

    /* HPバー */
    .hud-bottom {
      padding: 0 16px env(safe-area-inset-bottom, 16px) 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hp-bar-container {
      flex: 1;
      max-width: 160px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 6px;
      height: 8px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    #hp-fill {
      height: 100%;
      width: 100%;
      background: #00e5ff;
      transition: width 0.15s ease;
    }

    /* モーダル画面（タイトル、クリア、ゲームオーバー） */
    .modal-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(11, 19, 43, 0.88);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .hidden {
      display: none !important;
    }

    .card-panel {
      background: rgba(20, 31, 54, 0.95);
      border: 2px solid #00e5ff;
      border-radius: 20px;
      padding: 24px 20px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 229, 255, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .concept-hero {
      width: 130px;
      height: 130px;
      object-fit: cover;
      object-position: top center;
      border-radius: 50%;
      border: 3px solid #76ff03;
      box-shadow: 0 4px 16px rgba(118, 255, 3, 0.5);
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.45rem;
      color: #ffffff;
      margin-bottom: 8px;
      line-height: 1.3;
      text-shadow: 0 2px 8px rgba(0, 229, 255, 0.5);
    }

    .desc {
      font-size: 0.9rem;
      color: #b0bec5;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .tutorial-box {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      width: 100%;
      font-size: 0.85rem;
      color: #eceff1;
      text-align: left;
    }

    .tutorial-box li {
      margin-left: 18px;
      margin-bottom: 4px;
    }

    .btn-action {
      background: linear-gradient(135deg, #00e5ff, #00b0ff);
      color: #0b132b;
      border: none;
      padding: 14px 32px;
      border-radius: 30px;
      font-size: 1.15rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.4);
      width: 100%;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-action:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(0, 229, 255, 0.2);
    }

    .btn-success {
      background: linear-gradient(135deg, #76ff03, #00e676);
      color: #003300;
      box-shadow: 0 6px 20px rgba(118, 255, 3, 0.4);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.95rem;
      color: #cfd8dc;
    }

    .stat-val {
      font-weight: bold;
      color: #00e5ff;
    }

    .guide-drag {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
      pointer-events: none;
      animation: pulseGuide 2s infinite;
    }

    @keyframes pulseGuide {
      0%, 100% { opacity: 0.5; transform: translate(-50%, 0); }
      50% { opacity: 0.9; transform: translate(-50%, -4px); }
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-container">
    <!-- プレイ中 HUD -->
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="gary-badge">
          <svg class="gary-face-svg" viewBox="0 0 100 80">
            <!-- スライム体型 -->
            <path d="M 10 65 Q 10 25 50 15 Q 90 25 90 65 Q 85 75 50 75 Q 15 75 10 65 Z" fill="#64ff24" stroke="#ffffff" stroke-width="4"/>
            <!-- 泡 -->
            <circle cx="78" cy="28" r="8" fill="#64ff24" stroke="#ffffff" stroke-width="3"/>
            <!-- 目 -->
            <ellipse cx="38" cy="45" rx="6" ry="8" fill="#111111"/>
            <circle cx="36" cy="42" r="2.5" fill="#ffffff"/>
            <ellipse cx="62" cy="45" rx="6" ry="8" fill="#111111"/>
            <circle cx="60" cy="42" r="2.5" fill="#ffffff"/>
            <!-- 口 -->
            <path d="M 44 55 Q 50 63 56 55 Z" fill="#b71c1c"/>
            <!-- チーク -->
            <circle cx="28" cy="52" r="4" fill="#ff4081" opacity="0.8"/>
            <circle cx="72" cy="52" r="4" fill="#ff4081" opacity="0.8"/>
          </svg>
          <span class="gary-label">ゲイリー</span>
          <span id="gary-count">3</span>
        </div>
        <div style="display: flex; align-items: center;">
          <div class="score-badge">
            <span id="score-val">0</span>
          </div>
          <button id="mute-btn" class="interactive">🔊</button>
        </div>
      </div>
      <div class="progress-bar-container">
        <div id="progress-fill"></div>
      </div>
      <div id="level-title" style="text-align: center; font-size: 0.75rem; color: #90caf9; margin-top: 2px;"></div>
    </div>

    <div class="guide-drag">左右スワイプで部隊を移動</div>

    <div class="hud-bottom">
      <div style="font-size: 0.75rem; color: #90caf9; font-weight: bold;">もじさん HP</div>
      <div class="hp-bar-container">
        <div id="hp-fill"></div>
      </div>
    </div>
  </div>

  <!-- タイトル画面 -->
  <div id="title-screen" class="modal-screen interactive">
    <div class="card-panel">
      <img src="./assets/moji-gary-concept.png" alt="もじさん＆ゲイリー" class="concept-hero">
      <h1>もじさん＆ゲイリーの<br>ゲート突破大作戦</h1>
      <p class="desc">頼れるおじさん「もじさん」と、ぷにぷに相棒「ゲイリー」が電脳世界を駆け抜ける！</p>
      
      <div class="tutorial-box">
        <ul>
          <li>👆 <b>画面を左右にドラッグ</b>して移動</li>
          <li>🔫 <b>ゲートを撃つ</b>と数値がぐんぐん育つ！</li>
          <li>🟢 <b>青・金ゲート</b>でゲイリー軍団を爆発増殖</li>
          <li>👾 <b>奥の巨大ボス</b>を大弾幕で撃破せよ！</li>
        </ul>
      </div>

      <button id="start-btn" class="btn-action">出撃開始！</button>
    </div>
  </div>

  <!-- ゲームオーバー画面 -->
  <div id="gameover-screen" class="modal-screen hidden interactive">
    <div class="card-panel">
      <h1 style="color: #ff5252;">作戦失敗...</h1>
      <p class="desc">「もじさん、大丈夫！次はもっとゲイリーを増やそう！」</p>
      <div style="margin: 16px 0; width: 100%;">
        <div class="stat-row">
          <span>スコア</span>
          <span id="gameover-score" class="stat-val">0</span>
        </div>
      </div>
      <button id="restart-btn" class="btn-action">再出撃する</button>
    </div>
  </div>

  <!-- ステージクリア画面 -->
  <div id="clear-screen" class="modal-screen hidden interactive">
    <div class="card-panel">
      <h1 style="color: #76ff03;">作戦大成功！！</h1>
      <p class="desc">メガ・ボスを粉砕し、電脳ハイウェイを制圧した！</p>
      <div style="margin: 16px 0; width: 100%;">
        <div class="stat-row">
          <span>獲得スコア</span>
          <span id="clear-score" class="stat-val">0</span>
        </div>
        <div class="stat-row">
          <span>生存ゲイリー数</span>
          <span id="clear-gary" class="stat-val">0</span>
        </div>
        <div class="stat-row">
          <span>ボーナス倍率</span>
          <span id="clear-bonus" class="stat-val">×1.0</span>
        </div>
      </div>
      <button id="next-btn" class="btn-action btn-success">次のステージへ</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
