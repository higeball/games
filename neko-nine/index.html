<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ネコナイン - ヒゲボールゲームズ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #000000;
      color: #ffffff;
      font-family: 'DotGothic16', monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .container {
      background: #000000;
      border: 3px double #ffffff;
      border-radius: 8px;
      padding: 24px 20px;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      background: #111111;
      border: 1.5px solid #ffd700;
      color: #ffd700;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .cat-icon {
      font-size: 52px;
      line-height: 1;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.5));
      animation: catBounce 1.2s infinite alternate ease-in-out;
    }
    @keyframes catBounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-6px); }
    }
    h1 {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 2px 2px 0 #000;
    }
    .subtitle {
      font-size: 13px;
      color: #aaaaaa;
      line-height: 1.6;
    }
    .notice-box {
      background: #0d0d0d;
      border: 1.5px dashed #444444;
      border-radius: 6px;
      padding: 14px 16px;
      font-size: 12.5px;
      color: #e2e8f0;
      line-height: 1.8;
      width: 100%;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      background: #000000;
      border: 2px solid #ffffff;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: background 0.15s, color 0.15s, transform 0.05s;
    }
    .back-btn:hover, .back-btn:active {
      background: #ffffff;
      color: #000000;
      transform: scale(0.98);
    }
    .footer {
      font-size: 11px;
      color: #666666;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">COMING SOON</div>
    <div class="cat-icon">🐱🐾</div>
    <h1>ネコナイン</h1>
    <div class="subtitle">〜 Neko Nine 〜</div>
    <div class="notice-box">
      ただいまゲームコンテンツを鋭意制作中です！<br>
      公開まで今しばらくお待ちください。<br>
      <span style="color:#ffd700; font-size:11px;">※/neko-nine にコンテンツ格納後、本画面が切り替わります</span>
    </div>
    <a href="../" class="back-btn">◀ ヒゲボールゲームズへ戻る</a>
    <div class="footer">© 2026 株式会社ヒゲボール / ヒゲボール制作委員会</div>
  </div>
</body>
</html>
